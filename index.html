.left{
  left:0;
  background-position:left center;
  transform-origin:left center;
}
.right{
  right:0;
  background-position:right center;
  transform-origin:right center;
}
.light{
  position:absolute;
  left:50%;
  top:0;
  width:8%;
  height:100%;
  z-index:1;
  opacity:.05;
  transform:translateX(-50%) scaleX(.08);
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,220,145,.7) 42%,
    rgba(255,247,210,.95) 50%,
    rgba(255,220,145,.7) 58%,
    transparent
  );
  filter:blur(12px);
  transition:opacity 6.8s ease 1.8s,transform 7.2s ease 1.4s;
}
.stage.open .left{
  transform:rotateY(-92deg);
  filter:brightness(.42);
}
.stage.open .right{
  transform:rotateY(92deg);
  filter:brightness(.42);
}
.stage.open .light{
  opacity:.52;
  transform:translateX(-50%) scaleX(.72);
}
.stage.open .opened{
  opacity:1;
  transform:scale(1);
  filter:brightness(1) saturate(1) blur(0);
}
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="opened"></div>
  <div class="light"></div>

  <button class="portal" id="portal" aria-label="Entrance">
    <span class="panel left"></span>
    <span class="panel right"></span>
  </button>
</main>

<script>
const stage = document.getElementById("stage");
const portal = document.getElementById("portal");

function playStoneCreak() {
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  const audio = new AudioCtx();
  const now = audio.currentTime;

  const rumble = audio.createOscillator();
  const rumbleGain = audio.createGain();
  rumble.type = "sawtooth";
  rumble.frequency.setValueAtTime(42, now);
  rumble.frequency.exponentialRampToValueAtTime(25, now + 8);
  rumbleGain.gain.setValueAtTime(.0001, now);
  rumbleGain.gain.exponentialRampToValueAtTime(.055, now + .9);
  rumbleGain.gain.exponentialRampToValueAtTime(.025, now + 6.8);
  rumbleGain.gain.exponentialRampToValueAtTime(.0001, now + 8.3);
  rumble.connect(rumbleGain).connect(audio.destination);
  rumble.start(now);
  rumble.stop(now + 8.4);

  const len = audio.sampleRate * 8.2;
  const buffer = audio.createBuffer(1, len, audio.sampleRate);
  const data = buffer.getChannelData(0);

  for (let i = 0; i < len; i++) {
    const t = i / audio.sampleRate;
    const envelope =
      Math.sin(Math.min(1, t / 1.2) * Math.PI / 2) *
      Math.sin(Math.min(1, (8.2 - t) / 1.5) * Math.PI / 2);
    data[i] = (Math.random() * 2 - 1) * envelope;
  }

  const noise = audio.createBufferSource();
  const filter = audio.createBiquadFilter();
  const noiseGain = audio.createGain();

  filter.type = "bandpass";
  filter.frequency.setValueAtTime(180, now);
  filter.frequency.linearRampToValueAtTime(95, now + 8);
  filter.Q.value = .7;

  noiseGain.gain.setValueAtTime(.0001, now);
  noiseGain.gain.exponentialRampToValueAtTime(.075, now + 1.2);
  noiseGain.gain.exponentialRampToValueAtTime(.04, now + 6.4);
  noiseGain.gain.exponentialRampToValueAtTime(.0001, now + 8.15);

  noise.buffer = buffer;
  noise.connect(filter).connect(noiseGain).connect(audio.destination);
  noise.start(now);
  noise.stop(now + 8.2);

  const thud = audio.createOscillator();
  const thudGain = audio.createGain();
  thud.type = "sine";
  thud.frequency.setValueAtTime(62, now + 7.7);
  thud.frequency.exponentialRampToValueAtTime(30, now + 8.1);
  thudGain.gain.setValueAtTime(.0001, now + 7.65);
  thudGain.gain.exponentialRampToValueAtTime(.14, now + 7.76);
  thudGain.gain.exponentialRampToValueAtTime(.0001, now + 8.25);
  thud.connect(thudGain).connect(audio.destination);
  thud.start(now + 7.65);
  thud.stop(now + 8.3);
}

portal.addEventListener("click", function () {
  if (stage.classList.contains("open")) return;
  stage.classList.add("open");
  playStoneCreak();
});
</script>
</body>
