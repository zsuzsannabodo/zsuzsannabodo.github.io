<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zsuzsanna Bodó — Coming Soon</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}
body{overflow:hidden;background:#000;font-family:Georgia,"Times New Roman",serif}
.stage{position:relative;width:100%;height:100svh;min-height:540px;display:grid;place-items:center;overflow:hidden;perspective:1800px;background:radial-gradient(circle at 50% 45%,rgba(208,130,30,.16),transparent 34%),#000}
.portal{position:relative;height:min(94svh,1024px);aspect-ratio:3/4;max-width:96vw;transform-style:preserve-3d;cursor:pointer;z-index:3;border:0;padding:0;background:none;filter:drop-shadow(0 24px 55px rgba(0,0,0,.85))}
.panel{position:absolute;top:0;width:50%;height:100%;background-image:url("assets/door.webp");background-repeat:no-repeat;background-size:200% 100%;backface-visibility:hidden;transition:transform 2.3s cubic-bezier(.2,.78,.18,1),filter 1.8s ease}
.left{left:0;background-position:left center;transform-origin:left center}
.right{right:0;background-position:right center;transform-origin:right center}
.prompt{position:absolute;left:50%;bottom:5.5%;transform:translateX(-50%);z-index:5;color:#d6a13f;letter-spacing:.24em;font-size:clamp(.72rem,1.3vw,1rem);text-shadow:0 3px 12px #000;transition:opacity .45s ease;pointer-events:none}
.light{position:absolute;width:min(52vw,520px);height:82vh;max-height:760px;opacity:0;transform:scale(.32);background:radial-gradient(ellipse at 50% 48%,rgba(255,244,202,.98) 0%,rgba(255,208,112,.84) 17%,rgba(230,153,48,.44) 38%,rgba(128,65,10,.13) 62%,transparent 76%);filter:blur(12px);transition:opacity 1.2s ease .25s,transform 2.2s ease;z-index:1}
.reveal{position:absolute;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none;z-index:2;background:radial-gradient(circle at 50% 40%,rgba(193,119,22,.34),transparent 25%),linear-gradient(rgba(6,4,1,.28),rgba(0,0,0,.86));transition:opacity 1.1s ease 1.25s}
.reveal-inner{text-align:center;opacity:0;transform:translateY(20px);transition:opacity .9s ease 1.65s,transform .9s ease 1.65s}
.logo{color:#d6a13f;font-size:clamp(4.5rem,10vw,8rem);line-height:.82;font-style:italic;letter-spacing:-.12em;text-shadow:0 0 30px rgba(255,183,62,.24)}
.name{margin:28px 0 10px;color:#f0dfbf;text-transform:uppercase;letter-spacing:.14em;font-size:clamp(1.35rem,3vw,2.35rem);font-weight:400}
.rule{width:190px;height:1px;margin:22px auto;background:linear-gradient(90deg,transparent,#d6a13f,transparent)}
.soon{color:#d6a13f;text-transform:uppercase;letter-spacing:.18em;font-size:clamp(1.15rem,2.5vw,2rem)}
.stage.open .left{transform:rotateY(-105deg);filter:brightness(.48)}
.stage.open .right{transform:rotateY(105deg);filter:brightness(.48)}
.stage.open .prompt{opacity:0}
.stage.open .light{opacity:1;transform:scale(1.28)}
.stage.open .reveal{opacity:1;pointer-events:auto}
.stage.open .reveal-inner{opacity:1;transform:translateY(0)}
@media(max-width:600px){.stage{min-height:480px}.portal{width:96vw;height:auto;aspect-ratio:3/4}.light{width:76vw;height:65vh}}
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="light"></div>
  <button class="portal" id="portal" aria-label="Enter">
    <span class="panel left"></span>
    <span class="panel right"></span>
    <span class="prompt">ENTER</span>
  </button>
  <section class="reveal">
    <div class="reveal-inner">
      <div class="logo">ZB</div>
      <h1 class="name">Zsuzsanna Bodó</h1>
      <div class="rule"></div>
      <div class="soon">Coming Soon</div>
    </div>
  </section>
</main>
<script>
document.getElementById("portal").addEventListener("click",()=>document.getElementById("stage").classList.add("open"));
</script>
</body>
</html>
