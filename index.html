<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zsuzsanna Bodó — Coming Soon</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{overflow:hidden;background:#000;font-family:Georgia,"Times New Roman",serif}
.stage{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  overflow:hidden;
  perspective:1800px;
  background:#000;
}
.portal{
  position:absolute;
  inset:0;
  width:100vw;
  height:100vh;
  border:0;
  padding:0;
  margin:0;
  background:none;
  cursor:pointer;
  z-index:3;
  transform-style:preserve-3d;
}
.panel{
  position:absolute;
  top:0;
  width:50vw;
  height:100vh;
  background-image:url("assets/door-full.webp?v=4");
  background-repeat:no-repeat;
  background-size:100vw 100vh;
  backface-visibility:hidden;
  transition:transform 2.3s cubic-bezier(.2,.78,.18,1),filter 1.8s ease;
}
.left{
  left:0;
  background-position:left top;
  transform-origin:left center;
}
.right{
  right:0;
  background-position:right top;
  transform-origin:right center;
}
.entrance{
  position:absolute;
  left:50%;
  bottom:5%;
  transform:translateX(-50%);
  z-index:5;
  color:#d6a13f;
  font-size:clamp(.9rem,1.5vw,1.2rem);
  letter-spacing:.28em;
  text-transform:uppercase;
  text-shadow:0 3px 14px #000;
  pointer-events:none;
  transition:opacity .45s ease;
}
.light{
  position:absolute;
  inset:0;
  z-index:1;
  opacity:0;
  transform:scale(.45);
  background:radial-gradient(ellipse at center,
    rgba(255,244,202,.98) 0%,
    rgba(255,208,112,.82) 18%,
    rgba(230,153,48,.42) 40%,
    rgba(128,65,10,.12) 65%,
    transparent 80%);
  filter:blur(14px);
  transition:opacity 1.2s ease .25s,transform 2.2s ease;
}
.reveal{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  z-index:2;
  opacity:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 42%,rgba(193,119,22,.34),transparent 28%),
    linear-gradient(rgba(6,4,1,.18),rgba(0,0,0,.86));
  transition:opacity 1.1s ease 1.2s;
}
.reveal-inner{
  text-align:center;
  opacity:0;
  transform:translateY(18px);
  transition:opacity .9s ease 1.6s,transform .9s ease 1.6s;
}
.logo{
  color:#d6a13f;
  font-size:clamp(4.5rem,10vw,8rem);
  line-height:.82;
  font-style:italic;
  letter-spacing:-.12em;
}
.name{
  margin:28px 0 10px;
  color:#f0dfbf;
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:clamp(1.35rem,3vw,2.35rem);
  font-weight:400;
}
.rule{
  width:190px;
  height:1px;
  margin:22px auto;
  background:linear-gradient(90deg,transparent,#d6a13f,transparent);
}
.soon{
  color:#d6a13f;
  text-transform:uppercase;
  letter-spacing:.18em;
  font-size:clamp(1.15rem,2.5vw,2rem);
}
.stage.open .left{transform:rotateY(-105deg);filter:brightness(.44)}
.stage.open .right{transform:rotateY(105deg);filter:brightness(.44)}
.stage.open .entrance{opacity:0}
.stage.open .light{opacity:1;transform:scale(1.25)}
.stage.open .reveal{opacity:1;pointer-events:auto}
.stage.open .reveal-inner{opacity:1;transform:translateY(0)}
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="light"></div>
  <button class="portal" id="portal" aria-label="Entrance">
    <span class="panel left"></span>
    <span class="panel right"></span>
    <span class="entrance">Entrance</span>
  </button>
  <section class="reveal">
    <div class="reveal-inner">
      <div class="logo">ZB</div>
      <h1 class="name">Zsuzsanna Bodó</h1>
      <div class="rule"></div>
      <div class="soon">Coming Soon</div>
    </div>
  </section>
</main>
<script>
document.getElementById("portal").addEventListener("click",()=>{
  document.getElementById("stage").classList.add("open");
});
</script>
</body>
</html>
